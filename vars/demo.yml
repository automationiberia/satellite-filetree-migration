# Demo import uploads manifest and applies LE + locations.
satellite_configuration_dispatch_manifest_upload: true
satellite_configuration_dispatch_manifest_validate: true
satellite_configuration_dispatch_content_view_publish_promote: false

# Tags used by scripts/demo.sh
satellite_demo_export_tags: lifecycle_environments,locations,vault_template
satellite_demo_import_tags: lifecycle_environments,locations,manifest,manifest_validate
